name: Build and Release Speaky

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: speaky-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: speaky-tauri

      - name: Build Tauri bundles
        run: npm run tauri build -- --target ${{ matrix.rust_target }}
        working-directory: speaky-tauri

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: speaky-${{ matrix.rust_target }}
          path: speaky-tauri/src-tauri/target/${{ matrix.rust_target }}/release/bundle/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Remove stale release and assets
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: context.ref.replace('refs/tags/', ''),
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
              });
              core.info(`Removed stale release ${release.data.id}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing release to remove');
            }

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f -maxdepth 4 -print
        working-directory: .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.sig
          preserve_order: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
